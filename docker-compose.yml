services:
  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: mqtt-broker
    ports:
      - "1884:1883"  # Expose MQTT port
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf  # Mount custom Mosquitto config
    networks:
      - app-network

  ds2-ddt:
    image: ds2-ddt:prod
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ds2-ddt
    depends_on:
      - mqtt-broker
    environment:
      BROKER: mqtt-broker
      PORT: 1883
    volumes:
      # Only mount the runtime-editable data, not the whole config/ package
      - ./config/generated_mqtt_config.json:/app/config/generated_mqtt_config.json
      - ./config/validations:/app/config/validations
    ports:
      - "5000:5000"  # expose main application port for local testing
      - "8000:8000"  # expose fastapi port for local testing
    networks:
      - app-network

  ds2-configurator:
    image: ds2-configurator:1.1.0
    build:
      context: /mnt/c/Users/jonas/Documents/BBS/ds2-configurator
      dockerfile: Dockerfile
    container_name: ds2-configurator
    depends_on:
      - ds2-ddt
    volumes:
      - /mnt/c/Users/jonas/Documents/BBS/ds2-configurator/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "4200:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge